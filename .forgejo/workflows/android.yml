name: Android

# Builds the Android app from the same static export as the website.
# On master and manual runs it signs with the upload key from the repo secrets,
# producing an .aab for Google Play and an .apk for testing on a phone.
on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-app.sh"
      - "scripts/app-index.mjs"
      - ".forgejo/workflows/android.yml"
      - "scripts/store/play-upload.py"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "next.config.ts"
      - "capacitor.config.ts"
      - "package.json"
      - ".forgejo/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Snakkespil (Danish and English, with Goodtalk as its English half) and Snakkespil 18+
      # (issue #57) from the same native project. Goodtalk is no app of its own any more: Apple
      # rejected it under 4.3, so com.goodtalkcards.app is not built.
      matrix:
        include:
          - site: da
            variant: ""
            app_id: dk.snakkespil.app
            app_name: Snakkespil
            artifact: snakkespil
          - site: da
            variant: voksen
            app_id: dk.snakkespil.voksen
            app_name: Snakkespil 18+
            artifact: snakkespil-voksen
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      SITE_LOCALE: ${{ matrix.site }}
      APP_VARIANT: ${{ matrix.variant }}
      APP_ID: ${{ matrix.app_id }}
      APP_NAME: ${{ matrix.app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The default package list asks for "tools", which cmdline-tools 16 no longer has
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - run: npm ci
      - name: Build the web content
        run: |
          set -euo pipefail
          if [ "$APP_VARIANT" = voksen ]; then
            npm run build
            # The 18+ app has the adult cards and dares, and nothing for families, kids or school (issue #57)
            grep -rqE '"adult-1"' out/ || { echo "voksenkort mangler i 18+-appen"; exit 1; }
            grep -rqE '"hot-1"' out/ || { echo "udfordringer mangler i 18+-appen"; exit 1; }
            if grep -rqE '"(boern|fam|barn|ven|kol|hoej|indskolingen|mellemtrinnet|udskolingen|studieliv|gymnasiet|efterskolen|spejder|gilwell)-[0-9]+"' out/; then echo "børne-, familie- eller skolekort fundet i 18+-appen"; exit 1; fi
          else
            # One folder per language in src/locales/appLocales.ts, out/index.html picks one (src/lib/appLang.ts)
            bash scripts/build-app.sh
            test -f out/index.html
            for lang in $(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e 'import { APP_LOCALE_CODES } from "./src/locales/appLocales.ts"; console.log(APP_LOCALE_CODES.join(" "))'); do
              test -f "out/$lang/index.html" || { echo "out/$lang mangler i app-buildet"; exit 1; }
            done
            # The adult cards must not be anywhere in the regular app bundle, in any language (issue #54)
            if grep -rqE '"adult-[0-9]+"|"hot-[0-9]+"|et helt upassende sted' out/; then echo "Voksenkort fundet i app-buildet"; exit 1; fi
          fi
      - run: npx cap sync android

      - name: Upload key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_BASE64 mangler i repo-secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gradle build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            bash ./gradlew --no-daemon bundleRelease assembleRelease
          else
            bash ./gradlew --no-daemon assembleDebug
          fi
          find app/build/outputs -name "*.aab" -o -name "*.apk" | xargs ls -la
          # the package id in the built app must be the one for this site
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          apk=$(find app/build/outputs/apk -name "*.apk" | head -1)
          # read it into a variable first: grep -q closing the pipe would fail aapt2 under pipefail
          badging=$("$aapt2" dump badging "$apk")
          grep -q "package: name='$APP_ID'" <<< "$badging" || { echo "forkert app-id i $apk:"; grep -E "^package:" <<< "$badging"; exit 1; }
          grep -q "application-label:'$APP_NAME'" <<< "$badging" || { echo "forkert app-navn i $apk:"; grep -E "^application-label" <<< "$badging"; exit 1; }
          # Snakkespil has its name in every app language (src/sprog/res/values-<code>: Goodtalk in
          # English, Pratspel in Swedish ...); the 18+ app has one name
          if [ "$APP_ID" = dk.snakkespil.app ]; then
            for dir in app/src/sprog/res/values-*; do
              lang=${dir##*/values-}
              name=$(sed -n 's/.*<string name="app_name">\(.*\)<\/string>.*/\1/p' "$dir/strings.xml")
              grep -q "application-label-$lang:'$name'" <<< "$badging" || { echo "app-navnet $name ($lang) mangler i $apk:"; grep -E "^application-label" <<< "$badging"; exit 1; }
            done
          elif grep -q "application-label-en:" <<< "$badging"; then
            echo "$APP_ID har fået et engelsk app-navn"; exit 1
          fi

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Master builds go to the closed test track in Google Play (scripts/store/play-upload.py).
      # Apps that do not exist in Play Console yet are skipped.
      - name: Upload to Google Play (closed testing)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ "$SITE_LOCALE" = en ]; then NOTES="New cards and improvements."; LANG_CODE=en-US; else NOTES="Nye kort og forbedringer."; LANG_CODE=da-DK; fi
          python3 scripts/store/play-upload.py "$APP_ID" android/app/build/outputs/bundle/release/app-release.aab alpha \
            "$(node -p 'require("./package.json").version') ($VERSION_CODE)" "$NOTES" "$LANG_CODE"

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
