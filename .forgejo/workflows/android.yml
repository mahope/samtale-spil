name: Android

# Builds the Android app from the same static export as the website.
# On master and manual runs it signs with the upload key from the repo secrets,
# producing an .aab for Google Play and an .apk for testing on a phone.
on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".forgejo/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - ".forgejo/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The default package list asks for "tools", which cmdline-tools 16 no longer has
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - run: npm ci
      - name: Build without the 18+ deck
        env:
          APP_BUILD: "1"
        run: |
          set -euo pipefail
          npm run build
          # The adult cards must not be anywhere in the app bundle (issue #54)
          if grep -rqF "et helt upassende sted" out/; then echo "Voksenkort fundet i app-buildet"; exit 1; fi
      - run: npx cap sync android

      - name: Upload key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_BASE64 mangler i repo-secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gradle build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            bash ./gradlew --no-daemon bundleRelease assembleRelease
          else
            bash ./gradlew --no-daemon assembleDebug
          fi
          find app/build/outputs -name "*.aab" -o -name "*.apk" | xargs ls -la

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: snakkespil-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
