name: Android

# Builds the Android app from the same static export as the website.
# On master and manual runs it signs with the upload key from the repo secrets,
# producing an .aab for Google Play and an .apk for testing on a phone.
on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".forgejo/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "next.config.ts"
      - "capacitor.config.ts"
      - "package.json"
      - ".forgejo/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Snakkespil (Danish) and Goodtalk (English, issue #74) from the same native project
      matrix:
        include:
          - site: da
            app_id: dk.snakkespil.app
            app_name: Snakkespil
            artifact: snakkespil
          - site: en
            app_id: com.goodtalkcards.app
            app_name: Goodtalk
            artifact: goodtalk
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      SITE_LOCALE: ${{ matrix.site }}
      APP_ID: ${{ matrix.app_id }}
      APP_NAME: ${{ matrix.app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The default package list asks for "tools", which cmdline-tools 16 no longer has
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - run: npm ci
      - name: Build without the 18+ deck
        env:
          APP_BUILD: "1"
        run: |
          set -euo pipefail
          npm run build
          # The adult cards must not be anywhere in the app bundle (issue #54)
          if grep -rqE '"adult-[0-9]+"|et helt upassende sted' out/; then echo "Voksenkort fundet i app-buildet"; exit 1; fi
      - run: npx cap sync android

      - name: Upload key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_BASE64 mangler i repo-secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gradle build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            bash ./gradlew --no-daemon bundleRelease assembleRelease
          else
            bash ./gradlew --no-daemon assembleDebug
          fi
          find app/build/outputs -name "*.aab" -o -name "*.apk" | xargs ls -la
          # the package id in the built app must be the one for this site
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          apk=$(find app/build/outputs/apk -name "*.apk" | head -1)
          # read it into a variable first: grep -q closing the pipe would fail aapt2 under pipefail
          badging=$("$aapt2" dump badging "$apk")
          grep -q "package: name='$APP_ID'" <<< "$badging" || { echo "forkert app-id i $apk:"; grep -E "^package:" <<< "$badging"; exit 1; }
          grep -q "application-label:'$APP_NAME'" <<< "$badging" || { echo "forkert app-navn i $apk:"; grep -E "^application-label" <<< "$badging"; exit 1; }

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
