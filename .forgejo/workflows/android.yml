name: Android

# Builds the Android app from the same static export as the website.
# On master and manual runs it signs with the upload key from the repo secrets,
# producing an .aab for Google Play and an .apk for testing on a phone.
on:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/build-app.sh"
      - "scripts/app-index.mjs"
      - ".forgejo/workflows/android.yml"
      - "scripts/store/play-upload.py"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "next.config.ts"
      - "capacitor.config.ts"
      - "package.json"
      - ".forgejo/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Snakkespil, one app with every app language (Goodtalk is its English half). Goodtalk is no
      # app of its own any more: Apple rejected it under 4.3, so com.goodtalkcards.app is not built.
      # Snakkespil 18+ (dk.snakkespil.voksen, issue #57) is replaced by Natsnak and is no longer
      # built or uploaded; the APP_VARIANT=voksen code paths stay for local builds.
      matrix:
        include:
          - site: da
            variant: ""
            app_id: dk.snakkespil.app
            app_name: Snakkespil
            artifact: snakkespil
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION_CODE: ${{ github.run_number }}
      SITE_LOCALE: ${{ matrix.site }}
      APP_VARIANT: ${{ matrix.variant }}
      APP_ID: ${{ matrix.app_id }}
      APP_NAME: ${{ matrix.app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Bun (fixed version) installs the dependencies from bun.lock; node still runs next, eslint, tsc and vitest
      - uses: https://github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
          # setup-bun's own cache has a post step without a timeout; on a runner whose cache server cannot be reached
          # it hangs until the job times out. The binary downloads in under a second.
          no-cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle distribution and dependencies: lower-case week key, so each runner saves at most once a week per Gradle
      # change (setup-java's own cache key has an upper-case "Linux" and is saved again on every run)
      # Is the runner's cache server reachable from this container? One-shot VM runners (192.168.122.x) cannot reach it,
      # and every cache step then waits almost 5 minutes for a connection. The cache steps below are skipped in that case.
      - name: Cache server reachable
        id: cacheprobe
        timeout-minutes: 1
        run: |
          url="${ACTIONS_CACHE_URL:-}"
          hostport=$(printf '%s' "$url" | sed -E 's#^[a-z]+://([^/]+).*#\1#')
          ok=true
          if [ -n "$hostport" ]; then
            case "$hostport" in *:*) host=${hostport%%:*}; port=${hostport##*:};; *) host=$hostport; port=80;; esac
            timeout 3 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null || ok=false
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "cache server ${hostport:-unknown} reachable: $ok"

      - name: Week for the Gradle cache key
        id: uge
        run: echo "uge=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      # Explicit restore and save steps (not the combined actions/cache): its post step has no timeout of its own, and on a
      # runner whose cache server cannot be reached each restore and save takes almost 5 minutes. Here they are skipped
      # when the server cannot be reached (step above), may fail without failing the job, and the save is only tried when
      # the restore reached the server. No timeout-minutes on cache steps: an expired step timeout turns the job red
      # even with continue-on-error (measured 17/11-26).
      - name: Restore the Gradle cache
        id: cache
        if: steps.cacheprobe.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}-${{ steps.uge.outputs.uge }}
          restore-keys: |
            gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}-
            gradle-

      # The default package list asks for "tools", which cmdline-tools 16 no longer has
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - run: bun install --frozen-lockfile
      - name: Build the web content
        run: |
          set -euo pipefail
          if [ "$APP_VARIANT" = voksen ]; then
            bun run build
            # The 18+ app has the adult cards and dares, and nothing for families, kids or school (issue #57)
            grep -rqE '"adult-1"' out/ || { echo "voksenkort mangler i 18+-appen"; exit 1; }
            grep -rqE '"hot-1"' out/ || { echo "udfordringer mangler i 18+-appen"; exit 1; }
            if grep -rqE '"(boern|fam|barn|ven|kol|hoej|indskolingen|mellemtrinnet|udskolingen|studieliv|gymnasiet|efterskolen|spejder|gilwell)-[0-9]+"' out/; then echo "børne-, familie- eller skolekort fundet i 18+-appen"; exit 1; fi
          else
            # One folder per language in src/locales/appLocales.ts, out/index.html picks one (src/lib/appLang.ts)
            APP_BUILD_JOBS=4 bash scripts/build-app.sh
            test -f out/index.html
            for lang in $(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e 'import { APP_LOCALE_CODES } from "./src/locales/appLocales.ts"; console.log(APP_LOCALE_CODES.join(" "))'); do
              test -f "out/$lang/index.html" || { echo "out/$lang mangler i app-buildet"; exit 1; }
            done
            # The adult cards must not be anywhere in the regular app bundle, in any language (issue #54)
            if grep -rqE '"adult-[0-9]+"|"hot-[0-9]+"|et helt upassende sted' out/; then echo "Voksenkort fundet i app-buildet"; exit 1; fi
          fi
      - run: bun x cap sync android

      - name: Upload key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "ANDROID_KEYSTORE_BASE64 mangler i repo-secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Gradle build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            bash ./gradlew --no-daemon bundleRelease assembleRelease
          else
            bash ./gradlew --no-daemon assembleDebug
          fi
          find app/build/outputs -name "*.aab" -o -name "*.apk" | xargs ls -la
          # the package id in the built app must be the one for this site
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          apk=$(find app/build/outputs/apk -name "*.apk" | head -1)
          # read it into a variable first: grep -q closing the pipe would fail aapt2 under pipefail
          badging=$("$aapt2" dump badging "$apk")
          grep -q "package: name='$APP_ID'" <<< "$badging" || { echo "forkert app-id i $apk:"; grep -E "^package:" <<< "$badging"; exit 1; }
          grep -q "application-label:'$APP_NAME'" <<< "$badging" || { echo "forkert app-navn i $apk:"; grep -E "^application-label" <<< "$badging"; exit 1; }
          # Snakkespil has its name in every app language (src/sprog/res/values-<code>: Goodtalk in
          # English, Pratspel in Swedish ...); the 18+ app has one name
          if [ "$APP_ID" = dk.snakkespil.app ]; then
            for dir in app/src/sprog/res/values-*; do
              lang=${dir##*/values-}
              name=$(sed -n 's/.*<string name="app_name">\(.*\)<\/string>.*/\1/p' "$dir/strings.xml")
              grep -q "application-label-$lang:'$name'" <<< "$badging" || { echo "app-navnet $name ($lang) mangler i $apk:"; grep -E "^application-label" <<< "$badging"; exit 1; }
            done
          elif grep -q "application-label-en:" <<< "$badging"; then
            echo "$APP_ID har fået et engelsk app-navn"; exit 1
          fi

      - name: Save the Gradle cache
        if: success() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          # The restore step's own key: android/ is changed by `cap sync` in between, so a hash computed here would differ.
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Master builds go to the closed test track in Google Play (scripts/store/play-upload.py).
      # Apps that do not exist in Play Console yet are skipped.
      - name: Upload to Google Play (closed testing)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ "$SITE_LOCALE" = en ]; then NOTES="New cards and improvements."; LANG_CODE=en-US; else NOTES="Nye kort og forbedringer."; LANG_CODE=da-DK; fi
          python3 scripts/store/play-upload.py "$APP_ID" android/app/build/outputs/bundle/release/app-release.aab alpha \
            "$(node -p 'require("./package.json").version') ($VERSION_CODE)" "$NOTES" "$LANG_CODE"

      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
