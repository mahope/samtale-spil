name: iOS

# Compile check for the iOS app on the Mac runner (mahope-mac). Unsigned simulator
# build: signing and TestFlight upload need the Apple team's certificates (issue #20).
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Snakkespil (Danish) and Goodtalk (English, issue #74) from the same native project
      matrix:
        include:
          - site: da
            app_id: dk.snakkespil.app
            app_name: Snakkespil
            artifact: snakkespil
          - site: en
            app_id: com.goodtalkcards.app
            app_name: Goodtalk
            artifact: goodtalk
    runs-on: macos
    env:
      SITE_LOCALE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Build without the 18+ deck
        env:
          APP_BUILD: "1"
        run: |
          set -euo pipefail
          npm run build
          # The adult cards must not be anywhere in the app bundle (issue #54)
          if grep -rqE '"adult-[0-9]+"|et helt upassende sted' out/; then echo "Voksenkort fundet i app-buildet"; exit 1; fi
      - run: npx cap sync ios
      - name: Xcode build (simulator, unsigned)
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            PRODUCT_BUNDLE_IDENTIFIER="${{ matrix.app_id }}" APP_DISPLAY_NAME="${{ matrix.app_name }}" APP_DEV_REGION="${{ matrix.site }}" \
            CODE_SIGNING_ALLOWED=NO build | tail -20
