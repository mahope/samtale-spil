name: iOS

# iOS on the Mac runner (mahope-mac). Manual runs compile an unsigned simulator build; master builds are signed and uploaded to App Store Connect (scripts/store/ios-release.sh),
# which only skips apps that have no App Store Connect record yet.
on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/build-app.sh"
      - "scripts/app-index.mjs"
      - ".forgejo/workflows/ios.yml"
      - "scripts/store/ios-release.sh"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Snakkespil, one app with every app language (Goodtalk is its English half). Goodtalk is no
      # app of its own any more: Apple rejected it under 4.3, so com.goodtalkcards.app is not built.
      # Snakkespil 18+ (dk.snakkespil.voksen, issue #57) is replaced by Natsnak and is no longer
      # built or uploaded; the APP_VARIANT=voksen code paths stay for local builds.
      matrix:
        include:
          - site: da
            variant: ""
            app_id: dk.snakkespil.app
            app_name: Snakkespil
            artifact: snakkespil
    runs-on: macos
    env:
      SITE_LOCALE: ${{ matrix.site }}
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Bun (fixed version) installs the dependencies from bun.lock; node still runs next, eslint, tsc and vitest
      - uses: https://github.com/oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
          # setup-bun's own cache has a post step without a timeout; on a runner whose cache server cannot be reached
          # it hangs until the job times out. The binary downloads in under a second.
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Build the web content
        run: |
          set -euo pipefail
          if [ "$APP_VARIANT" = voksen ]; then
            bun run build
            # The 18+ app has the adult cards and dares, and nothing for families, kids or school (issue #57)
            grep -rqE '"adult-1"' out/ || { echo "voksenkort mangler i 18+-appen"; exit 1; }
            grep -rqE '"hot-1"' out/ || { echo "udfordringer mangler i 18+-appen"; exit 1; }
            if grep -rqE '"(boern|fam|barn|ven|kol|hoej|indskolingen|mellemtrinnet|udskolingen|studieliv|gymnasiet|efterskolen|spejder|gilwell)-[0-9]+"' out/; then echo "børne-, familie- eller skolekort fundet i 18+-appen"; exit 1; fi
          else
            # One folder per language in src/locales/appLocales.ts, out/index.html picks one (src/lib/appLang.ts)
            bash scripts/build-app.sh
            test -f out/index.html
            for lang in $(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --input-type=module -e 'import { APP_LOCALE_CODES } from "./src/locales/appLocales.ts"; console.log(APP_LOCALE_CODES.join(" "))'); do
              test -f "out/$lang/index.html" || { echo "out/$lang mangler i app-buildet"; exit 1; }
            done
            # The adult cards must not be anywhere in the regular app bundle, in any language (issue #54)
            if grep -rqE '"adult-[0-9]+"|"hot-[0-9]+"|et helt upassende sted' out/; then echo "Voksenkort fundet i app-buildet"; exit 1; fi
          fi
      - run: bun x cap sync ios
      - name: Xcode build (simulator, unsigned)
        if: github.event_name != 'push'
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ matrix.app_id }}" APP_DISPLAY_NAME="${{ matrix.app_name }}" APP_DEV_REGION="${{ matrix.site }}" \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      # Snakkespil has its home screen name in every app language: Goodtalk on an English iPhone,
      # Pratspel on a Swedish one ... (ios/App/Sprog/<code>.lproj, build phase "Localize the name")
      - name: Localized name in the app
        if: github.event_name != 'push' && matrix.app_id == 'dk.snakkespil.app'
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          locs=$(/usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$app/Info.plist")
          for dir in ios/App/Sprog/*.lproj; do
            lang=$(basename "$dir" .lproj)
            name=$(sed -n 's/^"CFBundleDisplayName" = "\(.*\)";$/\1/p' "$dir/InfoPlist.strings")
            grep -q "\"CFBundleDisplayName\" = \"$name\"" "$app/$lang.lproj/InfoPlist.strings" || { echo "$lang.lproj mangler $name"; exit 1; }
            grep -qx " *$lang" <<< "$locs" || { echo "CFBundleLocalizations mangler $lang"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$app/Info.plist" | grep -qx da

      - name: Signed build to App Store Connect
        if: github.event_name == 'push'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        # build numbers from 1000 up, above the hand-made builds (the last one was 300)
        run: bash scripts/store/ios-release.sh "${{ matrix.app_id }}" "${{ matrix.app_name }}" "${{ matrix.site }}" "$((1000 + ${{ github.run_number }}))"
