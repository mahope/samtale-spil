name: iOS

# iOS on the Mac runner (mahope-mac). Pull requests and manual runs compile an unsigned simulator
# build; master builds are signed and uploaded to App Store Connect (scripts/store/ios-release.sh),
# which only skips apps that have no App Store Connect record yet.
on:
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "src/**"
      - "public/**"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".forgejo/workflows/ios.yml"
      - "scripts/store/ios-release.sh"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Snakkespil (Danish), Goodtalk (English, issue #74) and Snakkespil 18+ (issue #57)
      # from the same native project
      matrix:
        include:
          - site: da
            variant: ""
            app_id: dk.snakkespil.app
            app_name: Snakkespil
            artifact: snakkespil
          - site: en
            variant: ""
            app_id: com.goodtalkcards.app
            app_name: Goodtalk
            artifact: goodtalk
          - site: da
            variant: voksen
            app_id: dk.snakkespil.voksen
            app_name: Snakkespil 18+
            artifact: snakkespil-voksen
    runs-on: macos
    env:
      SITE_LOCALE: ${{ matrix.site }}
      APP_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Build the web content
        run: |
          set -euo pipefail
          if [ "$APP_VARIANT" = voksen ]; then
            npm run build
            # The 18+ app has the adult cards and dares, and nothing for families, kids or school (issue #57)
            grep -rqE '"adult-1"' out/ || { echo "voksenkort mangler i 18+-appen"; exit 1; }
            grep -rqE '"hot-1"' out/ || { echo "udfordringer mangler i 18+-appen"; exit 1; }
            if grep -rqE '"(boern|fam|barn|ven|kol|hoej|indskolingen|mellemtrinnet|udskolingen|studieliv|gymnasiet|efterskolen|spejder|gilwell)-[0-9]+"' out/; then echo "børne-, familie- eller skolekort fundet i 18+-appen"; exit 1; fi
          else
            APP_BUILD=1 npm run build
            # The adult cards must not be anywhere in the regular app bundle (issue #54)
            if grep -rqE '"adult-[0-9]+"|"hot-[0-9]+"|et helt upassende sted' out/; then echo "Voksenkort fundet i app-buildet"; exit 1; fi
          fi
      - run: npx cap sync ios
      - name: Xcode build (simulator, unsigned)
        if: github.event_name != 'push'
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            PRODUCT_BUNDLE_IDENTIFIER="${{ matrix.app_id }}" APP_DISPLAY_NAME="${{ matrix.app_name }}" APP_DEV_REGION="${{ matrix.site }}" \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Signed build to App Store Connect
        if: github.event_name == 'push'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        # build numbers from 100 up, above the hand-made builds
        run: bash scripts/store/ios-release.sh "${{ matrix.app_id }}" "${{ matrix.app_name }}" "${{ matrix.site }}" "$((100 + ${{ github.run_number }}))"
