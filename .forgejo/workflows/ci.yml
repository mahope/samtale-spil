name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - name: Audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test:run
      - name: Build
        run: npm run build

      - name: Verify static export
        run: |
          set -euo pipefail
          for f in index.html 404.html spil/index.html spil/parforhold/index.html spoergsmaal/index.html                    spoergsmaal/parforhold/index.html spoergsmaal/parforhold/opengraph-image opengraph-image                    om/index.html privatliv/index.html sitemap.xml robots.txt manifest.json favicon.ico apple-icon.png; do
            test -f "out/$f" || { echo "missing out/$f"; exit 1; }
          done
          if grep -rl "github.io" out --include=*.html --include=*.xml --include=*.txt; then
            echo "old github.io URLs in export"; exit 1
          fi
          # play screens stay out of the index, content pages stay in
          grep -q 'name="robots" content="noindex' out/spil/parforhold/index.html || { echo "play screen is indexable"; exit 1; }
          if grep -q 'name="robots" content="noindex' out/spoergsmaal/parforhold/index.html; then echo "landing page is noindex"; exit 1; fi
          # the landing page carries the questions in its HTML
          n=$(grep -o '<li class="flex gap-4' out/spoergsmaal/parforhold/index.html | wc -l)
          [ "$n" -ge 10 ] || { echo "landing page lists only $n questions"; exit 1; }
          grep -q 'rel="canonical" href="https://snakkespil.dk/spoergsmaal/parforhold/"' out/spoergsmaal/parforhold/index.html
          # the party-game pages carry their games and cards in the HTML
          test -f out/lege/index.html
          for f in out/lege/*/index.html; do
            case "$f" in */kort/*) continue ;; esac
            n=$(grep -o '<li class="flex gap-4' "$f" | wc -l)
            [ "$n" -ge 20 ] || { echo "$f lists only $n cards"; exit 1; }
          done
          # og:image must point at a file nginx serves as image/png (no trailing slash)
          og=$(grep -o '<meta property="og:image" content="[^"]*"' out/spoergsmaal/parforhold/index.html | sed -E 's#.*content="https://snakkespil.dk([^"?]*).*#\1#')
          echo "og:image -> $og"
          case "$og" in */opengraph-image) test -f "out$og" ;; *) echo "unexpected og:image path"; exit 1 ;; esac

      - name: Verify nginx config
        run: |
          set -euo pipefail
          S=""; command -v sudo >/dev/null && S="sudo"
          $S apt-get update -qq && $S apt-get install -y -qq nginx-light >/dev/null
          $S mkdir -p /etc/nginx/snippets
          $S cp deploy/security-headers.conf /etc/nginx/snippets/security-headers.conf
          $S rm -f /etc/nginx/sites-enabled/default
          $S cp deploy/nginx.conf /etc/nginx/conf.d/default.conf
          $S nginx -t
