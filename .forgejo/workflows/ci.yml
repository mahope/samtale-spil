name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - name: Audit (high and critical)
        run: npm audit --audit-level=high --omit=dev
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test:run
      - name: Build
        run: npm run build

      - name: Verify static export
        run: |
          set -euo pipefail
          for f in index.html 404.html spil/index.html spil/parforhold/index.html spoergsmaal/index.html                    spoergsmaal/parforhold/index.html spoergsmaal/parforhold/opengraph-image opengraph-image                    om/index.html privatliv/index.html sitemap.xml robots.txt manifest.json favicon.ico apple-icon.png; do
            test -f "out/$f" || { echo "missing out/$f"; exit 1; }
          done
          if grep -rl "github.io" out --include=*.html --include=*.xml --include=*.txt; then
            echo "old github.io URLs in export"; exit 1
          fi
          # play screens stay out of the index, content pages stay in
          grep -q 'name="robots" content="noindex' out/spil/parforhold/index.html || { echo "play screen is indexable"; exit 1; }
          if grep -q 'name="robots" content="noindex' out/spoergsmaal/parforhold/index.html; then echo "landing page is noindex"; exit 1; fi
          # the landing page carries the questions in its HTML
          n=$(grep -o '<li class="flex gap-4' out/spoergsmaal/parforhold/index.html | wc -l)
          [ "$n" -ge 10 ] || { echo "landing page lists only $n questions"; exit 1; }
          grep -q 'rel="canonical" href="https://snakkespil.dk/spoergsmaal/parforhold/"' out/spoergsmaal/parforhold/index.html
          # the party-game pages carry their games and cards in the HTML
          test -f out/lege/index.html
          for f in out/lege/*/index.html; do
            case "$f" in */kort/*) continue ;; esac
            n=$(grep -o '<li class="flex gap-4' "$f" | wc -l)
            [ "$n" -ge 20 ] || { echo "$f lists only $n cards"; exit 1; }
          done
          # daily question and generator carry their cards in the HTML
          for p in dagens-spoergsmaal generator; do
            n=$(grep -o 'data-kort="true"' "out/$p/index.html" | wc -l)
            [ "$n" -ge 7 ] || { echo "/$p/ has only $n cards in the HTML"; exit 1; }
            grep -q "rel=\"canonical\" href=\"https://snakkespil.dk/$p/\"" "out/$p/index.html"
            grep -q "<loc>https://snakkespil.dk/$p/</loc>" out/sitemap.xml
            if grep -q 'content="noindex' "out/$p/index.html"; then echo "/$p/ is noindex"; exit 1; fi
          done
          # every guide has the not-therapy box, exercise questions and sources in the HTML
          test -f out/guide/index.html
          for f in out/guide/*/index.html; do
            grep -q 'id="ikke-terapi"' "$f" || { echo "$f misses the not-therapy box"; exit 1; }
            n=$(grep -o 'data-kort="true"' "$f" | wc -l)
            [ "$n" -ge 12 ] || { echo "$f has only $n questions"; exit 1; }
            if grep -qiE '<title>[^<]*(test|terapi)' "$f"; then echo "$f: title contains test/terapi"; exit 1; fi
          done
          # print-yourself PDFs: one per deck, real PDFs, small enough to download
          n=$(ls out/print/*.pdf | wc -l)
          [ "$n" -ge 40 ] || { echo "only $n print PDFs"; exit 1; }
          for f in out/print/*.pdf; do
            head -c 5 "$f" | grep -q '%PDF-' || { echo "$f is not a PDF"; exit 1; }
            [ "$(stat -c %s "$f")" -lt 2000000 ] || { echo "$f is over 2 MB"; exit 1; }
            grep -q "href=\"/print/$(basename "$f")\"" out/print/index.html || { echo "$f is not linked from /print/"; exit 1; }
          done
          # og:image must point at a file nginx serves as image/png (no trailing slash)
          og=$(grep -o '<meta property="og:image" content="[^"]*"' out/spoergsmaal/parforhold/index.html | sed -E 's#.*content="https://snakkespil.dk([^"?]*).*#\1#')
          echo "og:image -> $og"
          case "$og" in */opengraph-image) test -f "out$og" ;; *) echo "unexpected og:image path"; exit 1 ;; esac

      - name: New site pages (app, dinner, not-therapy) and the menu
        run: |
          set -euo pipefail
          for p in app samtaler-ved-aftensmaden ikke-terapi; do
            f="out/$p/index.html"
            test -f "$f" || { echo "missing /$p/"; exit 1; }
            grep -q "rel=\"canonical\" href=\"https://snakkespil.dk/$p/\"" "$f" || { echo "/$p/ has no canonical"; exit 1; }
            grep -q "<loc>https://snakkespil.dk/$p/</loc>" out/sitemap.xml || { echo "/$p/ is not in the sitemap"; exit 1; }
            if grep -q 'content="noindex' "$f"; then echo "/$p/ is noindex"; exit 1; fi
          done
          # the dinner page carries its example questions and the FAQ in the HTML
          n=$(grep -o 'data-kort="true"' out/samtaler-ved-aftensmaden/index.html | wc -l)
          [ "$n" -ge 10 ] || { echo "/samtaler-ved-aftensmaden/ has only $n questions"; exit 1; }
          grep -q '"FAQPage"' out/samtaler-ved-aftensmaden/index.html || { echo "dinner page has no FAQPage JSON-LD"; exit 1; }
          # menu and footer link the new pages; the family deck page links the dinner page
          grep -q 'aria-controls=' out/index.html || { echo "front page has no menu button"; exit 1; }
          grep -q 'href="/app/"' out/index.html || { echo "front page does not link /app/"; exit 1; }
          grep -q 'href="/samtaler-ved-aftensmaden/"' out/spoergsmaal/familie/index.html || { echo "family deck does not link the dinner page"; exit 1; }
          # play screens keep their own header, without the site menu
          if grep -q 'menu-ark' out/spil/parforhold/index.html; then echo "site menu on a play screen"; exit 1; fi

      - name: Danish pages link their English version
        run: |
          set -euo pipefail
          grep -qi 'hreflang="en"' out/index.html || { echo "Danish home page has no hreflang=en"; exit 1; }
          grep -qi 'hreflang="en"' out/spoergsmaal/parforhold/index.html || { echo "Danish deck page has no hreflang=en"; exit 1; }

      - name: App build leaves out the 18+ deck
        run: |
          set -euo pipefail
          grep -rqE '"adult-[0-9]+"' out/ || { echo "guard finds no adult cards in the web build"; exit 1; }
          # the dares (hot-N) belong to the Snakkespil 18+ app only (issue #57)
          if grep -rqE '"hot-[0-9]+"' out/; then echo "18+-app dares in the web build"; exit 1; fi
          rm -rf out
          APP_BUILD=1 npm run build >/dev/null
          if grep -rqE '"adult-[0-9]+"|et helt upassende sted' out/; then echo "adult cards in the app build"; exit 1; fi

      - name: App build is the app shell, with no dead links
        run: |
          set -euo pipefail
          # out/ is still the APP_BUILD=1 export from the step above: the *.app.tsx tree (tabs, no site pages)
          grep -q 'data-shell="app"' out/index.html || { echo "the app build is not the app shell"; exit 1; }
          for p in mere indstillinger privatliv favoritter dagens-spoergsmaal spil/parforhold multiplayer; do
            test -f "out/$p/index.html" || { echo "missing /$p/ in the app"; exit 1; }
          done
          test ! -e out/spoergsmaal && test ! -e out/guide || { echo "website pages leaked into the app build"; exit 1; }
          npm run check:links

      - name: International build (Goodtalk, SITE_LOCALE=en)
        run: |
          set -euo pipefail
          rm -rf out
          SITE_LOCALE=en npm run build >/dev/null
          grep -q '<html lang="en"' out/index.html || { echo "English build is not lang=en"; exit 1; }
          if grep -q 'content="noindex' out/index.html; then echo "the English home page must be indexable"; exit 1; fi
          grep -qi 'hreflang="da"' out/questions/questions-for-couples/index.html || { echo "missing hreflang to the Danish deck"; exit 1; }
          grep -qi 'hreflang="da"' out/index.html || { echo "missing hreflang to the Danish home page"; exit 1; }
          test ! -e out/spil && test ! -e out/spoergsmaal || { echo "Danish routes leaked into the English build"; exit 1; }
          grep -q "<loc>https://goodtalkcards.com/questions/" out/sitemap.xml || { echo "English sitemap missing deck pages"; exit 1; }
          for f in out/questions/*/index.html; do
            n=$(grep -o 'data-kort="true"' "$f" | wc -l)
            [ "$n" -ge 20 ] || { echo "$f lists only $n questions"; exit 1; }
          done
          n=$(ls out/print/*.pdf | wc -l)
          [ "$n" -ge 40 ] || { echo "only $n English print PDFs"; exit 1; }
          grep -q '<loc>https://goodtalkcards.com/app/</loc>' out/sitemap.xml || { echo "/app/ is not in the English sitemap"; exit 1; }
          grep -q 'rel="canonical" href="https://goodtalkcards.com/app/"' out/app/index.html || { echo "English /app/ has no canonical"; exit 1; }
          if grep -q 'content="noindex' out/app/index.html; then echo "English /app/ is noindex"; exit 1; fi
          grep -q 'aria-controls=' out/index.html || { echo "English front page has no menu button"; exit 1; }
          for p in games games/christmas-games guide/love-languages daily-question question-generator print stats settings play/guess play/year-in-review; do
            test -f "out/$p/index.html" || { echo "missing /$p/"; exit 1; }
          done
          n=$(grep -o 'data-kort="true"' out/games/never-have-i-ever/index.html | wc -l)
          [ "$n" -ge 100 ] || { echo "never-have-i-ever lists only $n cards"; exit 1; }
          # no Danish cards or UI words in the English client code or pages
          if grep -rlqE 'categoryId:"dybe",text:"Hvis|Tryk for at vende|Næste kort' out/; then echo "Danish text in the English build"; exit 1; fi
          if grep -rqE '"adult-[0-9]+"' out/; then echo "adult cards in the English build"; exit 1; fi

      - name: Goodtalk app build is the English app shell, with no dead links
        run: |
          set -euo pipefail
          rm -rf out
          SITE_LOCALE=en APP_BUILD=1 npm run build >/dev/null
          # the *.intlapp.tsx tree: tabs, no website pages
          grep -q 'data-shell="app"' out/index.html || { echo "the Goodtalk app build is not the app shell"; exit 1; }
          grep -q '<html lang="en"' out/index.html || { echo "the Goodtalk app is not lang=en"; exit 1; }
          for p in more settings privacy about how-to-play favorites daily-question games play/questions-for-couples play/guess; do
            test -f "out/$p/index.html" || { echo "missing /$p/ in the Goodtalk app"; exit 1; }
          done
          test ! -e out/questions && test ! -e out/guide && test ! -e out/print || { echo "website pages leaked into the Goodtalk app"; exit 1; }
          # no Danish UI words, shell texts or cards anywhere in the English app
          # (public/manifest.json is the Danish site's PWA manifest; every build copies it, no app page links it)
          if grep -rlqE --exclude=manifest.json 'categoryId:"dybe",text:"Hvis|Tryk for at vende|Næste kort|Tilbage til|Spring til indholdet|Indstillinger|Favoritter|"Faner"' out/; then
            grep -rlE --exclude=manifest.json 'categoryId:"dybe",text:"Hvis|Tryk for at vende|Næste kort|Tilbage til|Spring til indholdet|Indstillinger|Favoritter|"Faner"' out/ | head -5
            echo "Danish text in the Goodtalk app"; exit 1
          fi
          if grep -rqE '"adult-[0-9]+"|"hot-[0-9]+"' out/; then echo "adult cards in the Goodtalk app"; exit 1; fi
          npm run check:links

      - name: 18+ app build is the app shell behind the age gate
        run: |
          set -euo pipefail
          rm -rf out
          APP_VARIANT=voksen npm run build >/dev/null
          grep -q 'data-shell="app"' out/index.html || { echo "the 18+ app is not the app shell"; exit 1; }
          grep -q 'Er du fyldt 18?' out/index.html || { echo "the age gate is missing in front of the 18+ app"; exit 1; }
          for p in i-aften favoritter mere indstillinger om privatliv ikke-terapi spil/udfordringer; do
            test -f "out/$p/index.html" || { echo "missing /$p/ in the 18+ app"; exit 1; }
            grep -q 'Er du fyldt 18?' "out/$p/index.html" || { echo "/$p/ is not behind the age gate"; exit 1; }
          done
          grep -rqE '"adult-1"' out/ && grep -rqE '"hot-1"' out/ || { echo "adult cards or dares missing in the 18+ app"; exit 1; }
          if grep -rqE '"(boern|fam|barn|ven|kol|hoej|indskolingen|mellemtrinnet|udskolingen|studieliv|gymnasiet|efterskolen|spejder|gilwell)-[0-9]+"' out/; then echo "kids, family or school cards in the 18+ app"; exit 1; fi
          npm run check:links

      - name: Verify nginx config
        run: |
          set -euo pipefail
          S=""; command -v sudo >/dev/null && S="sudo"
          $S apt-get update -qq && $S apt-get install -y -qq nginx-light >/dev/null
          $S mkdir -p /etc/nginx/snippets
          $S cp deploy/security-headers.conf /etc/nginx/snippets/security-headers.conf
          $S rm -f /etc/nginx/sites-enabled/default
          $S cp deploy/nginx.conf /etc/nginx/conf.d/default.conf
          $S nginx -t
