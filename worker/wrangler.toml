# Cloudflare Worker for snakkespil.dk/api/* (flag mails and public stats).
# Deployed from agent-worker with worker/deploy.sh; secrets live in Bitwarden.
name = "snakkespil-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
routes = [{ pattern = "snakkespil.dk/api/*", zone_name = "snakkespil.dk" }]

[vars]
MAIL_TO = "mads@mahoje.dk"
MAIL_FROM = "Snakkespil <snakkespil@mahoje.dk>"
PLAUSIBLE_HOST = "https://analytics.holstjensen.eu"

# 5 reports per IP per minute (Turnstile and the honeypot do the rest)
[[ratelimits]]
name = "FLAG_LIMIT"
namespace_id = "2001"
simple = { limit = 5, period = 60 }
