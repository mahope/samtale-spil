server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik on an internal port: redirects must stay relative,
    # otherwise /spil becomes http://snakkespil.dk:3000/spil/
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    error_page 404 /404.html;

    # Guessed addresses that people actually type; exact matches only, no wildcards
    location = /spoergsmaal/til-par { return 301 /spoergsmaal/parforhold/; }
    location = /spoergsmaal/til-par/ { return 301 /spoergsmaal/parforhold/; }
    location = /spoergsmaal/par { return 301 /spoergsmaal/parforhold/; }
    location = /spoergsmaal/par/ { return 301 /spoergsmaal/parforhold/; }
    location = /spoergsmaal/til-familien { return 301 /spoergsmaal/familie/; }
    location = /spoergsmaal/til-familien/ { return 301 /spoergsmaal/familie/; }
    location = /spoergsmaal/venner-spoergsmaal { return 301 /spoergsmaal/venner/; }
    location = /spoergsmaal/venner-spoergsmaal/ { return 301 /spoergsmaal/venner/; }

    location / {
        try_files $uri $uri/ $uri.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build assets never change
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.json {
        types { application/manifest+json json; }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Next exports share images without a file extension
    location ~ /opengraph-image$ {
        default_type image/png;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/manifest+json application/javascript text/xml application/xml image/svg+xml text/javascript;
}
