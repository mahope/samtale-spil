<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Snakkespil er flyttet</title>
<link rel="canonical" href="https://snakkespil.dk/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://snakkespil.dk/">
<script>
  // Keep the path: /samtale-spil/spil/parforhold -> https://snakkespil.dk/spil/parforhold/
  var p = location.pathname.replace(/^\/samtale-spil/, "") || "/";
  if (!p.endsWith("/")) p += "/";
  location.replace("https://snakkespil.dk" + p + location.search);
</script>
</head>
<body>
<p>Spillet er flyttet til <a href="https://snakkespil.dk/">snakkespil.dk</a>.</p>
</body>
</html>
