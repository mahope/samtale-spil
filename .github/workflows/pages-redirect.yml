name: GitHub Pages redirect

# mahope.github.io/samtale-spil was the old home. It now only forwards
# visitors (and search engines) to snakkespil.dk, path included.
on:
  push:
    branches: [master]
    paths: [".github/pages-redirect/**", ".github/workflows/pages-redirect.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
